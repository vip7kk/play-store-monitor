name: Play Store Monitor

on:
  schedule:
    # 每小时触发两次（避开整点调度高峰，GitHub 会延迟/丢弃整点任务）。
    # 脚本内部按 last_check_time 间隔判断实际是否查询，多余的一次空转无害；
    # 按北京时间判断周日跳过（GitHub cron 为 UTC，与北京时间差 8h）
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      first_run:
        description: '首次运行？通知所有应用当前状态'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore previous state
        uses: actions/cache@v4
        with:
          path: state.json
          key: play-monitor-state-${{ github.run_id }}
          restore-keys: |
            play-monitor-state-

      - name: Restore state from repo (cache miss fallback)
        if: hashFiles('state.json') == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/state.json?ref=main"
          code=$(curl -s -o state_resp.json -w "%{http_code}" -H "Authorization: token ${GH_TOKEN}" -H "User-Agent: monitor-bot" "$URL")
          if [ "$code" = "200" ]; then
            python -c "import json,base64;d=json.load(open('state_resp.json'));open('state.json','wb').write(base64.b64decode(d['content']))"
            echo "state.json restored from repo (cache was lost)"
          else
            echo "No state.json in repo (HTTP $code), starting with empty state"
          fi

      - name: Run monitor (normal)
        if: github.event.inputs.first_run != 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_CONFIG_URL: ${{ secrets.GH_CONFIG_URL }}
          ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python play_monitor.py

      - name: Run monitor (first run)
        if: github.event.inputs.first_run == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_CONFIG_URL: ${{ secrets.GH_CONFIG_URL }}
          ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python play_monitor.py --first-run

      - name: Save state for next run
        if: always()
        run: |
          if [ -f state.json ]; then
            echo "State file saved successfully"
            cat state.json
          fi

      - name: Save state to repo (persistent backup)
        if: always() && hashFiles('state.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cat > push_state.py <<'PYEOF'
          import json, base64, os, time, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com/repos/%s/contents/state.json" % repo
          headers = {"Authorization": "token " + token, "Accept": "application/vnd.github+json",
                     "Content-Type": "application/json", "User-Agent": "monitor-bot"}
          content_bytes = open("state.json", "rb").read()
          payload = base64.b64encode(content_bytes).decode()

          for attempt in range(3):
              try:
                  req = urllib.request.Request(api + "?ref=main", headers=headers)
                  try:
                      meta = json.load(urllib.request.urlopen(req))
                      sha = meta.get("sha", "")
                  except Exception:
                      sha = ""
                  body = {"message": "chore: update monitor state", "content": payload, "branch": "main"}
                  if sha:
                      body["sha"] = sha
                  req = urllib.request.Request(api, data=json.dumps(body).encode(),
                                               headers=headers, method="PUT")
                  resp = urllib.request.urlopen(req)
                  print("state.json committed to repo:", resp.status)
                  break
              except urllib.error.HTTPError as e:
                  print("commit failed:", e.code, e.reason)
                  time.sleep(5)
          PYEOF
          python push_state.py
